services:
  db:
    image: postgres:16-alpine
    container_name: mallatex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mallatex
      POSTGRES_USER: mallatex
      POSTGRES_PASSWORD: mallatex
    volumes:
      - mallatex_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mallatex"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mallatex-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mallatex:mallatex@db:5432/mallatex?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-cambia-este-secret-en-produccion}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  mallatex_pgdata:
