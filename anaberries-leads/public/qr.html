<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Código QR de registro · Anaberries — Mallatex</title>
  <meta name="theme-color" content="#ed3237" />
  <link rel="stylesheet" href="/css/landing.css" />
</head>
<body>
  <main class="qr-page">
    <img src="/assets/mallatex-logo.png" alt="Mallatex" style="height:46px" />
    <p class="qr-cta">Escanea y participa en el sorteo</p>
    <div class="qr-box">
      <div id="qr"></div>
    </div>
    <p class="qr-url" id="qr-url">…</p>
    <div class="no-print" style="margin-top:22px">
      <button class="btn-primary" style="max-width:280px;margin:0 auto" onclick="window.print()">🖨 Imprimir póster</button>
      <p style="font-size:13px;color:var(--ink-600);margin-top:14px">Coloca este código en el stand. Los visitantes lo escanean con la cámara de su teléfono para registrarse.</p>
    </div>
  </main>
  <p class="foot no-print">Mallatex · Evento Anaberries</p>

  <script src="/vendor/qrcode/qrcode.js"></script>
  <script>
    (function () {
      var url = window.location.origin + '/registro';
      document.getElementById('qr-url').textContent = url;
      try {
        var qr = qrcode(0, 'M');           // tipo automático, corrección media
        qr.addData(url);
        qr.make();
        document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
      } catch (e) {
        document.getElementById('qr').textContent = 'No se pudo generar el QR: ' + e.message;
      }
    })();
  </script>
</body>
</html>
