# Reverse-proxy TLS para Mallatex · Plataforma de Asistencia.
# Termina HTTPS (necesario para la cámara del kiosco) y reenvía a la app.
# Sustituye asistencia.mallatex.mx y las rutas de certificados por las reales.

server {
    listen 80;
    server_name asistencia.mallatex.mx;
    # Redirige todo a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name asistencia.mallatex.mx;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Subida de fotos/descriptores biométricos
    client_max_body_size 4m;

    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
