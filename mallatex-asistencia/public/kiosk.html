<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Mallatex · Control de acceso</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <script defer src="/vendor/faceapi/face-api.min.js"></script>
  <style>
    :root{ --red:#ed3237; --black:#232121; --ok:#22c55e; --warn:#f59e0b; --info:#38bdf8; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{ font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:#fff;
      background:radial-gradient(1200px 700px at 50% -10%, #2c2626 0%, #191515 55%, #120f0f 100%); height:100vh; overflow:hidden; user-select:none; }
    .kiosk{ height:100vh; display:flex; flex-direction:column; }
    .top{ display:flex; align-items:center; justify-content:space-between; padding:22px 34px; }
    .brand{ display:flex; align-items:center; gap:14px; }
    .brand img{ width:46px; height:46px; border-radius:12px; }
    .brand b{ font-size:20px; letter-spacing:.3px; } .brand span{ display:block; font-size:12px; color:#b9adac; font-weight:500; }
    .clock{ text-align:right; }
    .clock .t{ font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:1px; }
    .clock .d{ font-size:13px; color:#b9adac; text-transform:capitalize; }
    .stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
    .viewfinder{ width:300px; height:300px; border-radius:50%; position:relative; display:grid; place-items:center; }
    .viewfinder video{ width:270px; height:270px; border-radius:50%; object-fit:cover; transform:scaleX(-1); background:#0d0b0b; border:2px solid rgba(255,255,255,.12); }
    .viewfinder .ring{ position:absolute; inset:0; border-radius:50%; border:3px solid rgba(237,50,55,.4); transition:border-color .2s; }
    .viewfinder.detect .ring{ border-color:var(--ok); box-shadow:0 0 24px rgba(34,197,94,.5); }
    .viewfinder .pulse{ position:absolute; inset:6px; border-radius:50%; border:2px solid rgba(237,50,55,.3); animation:pulse 2s ease-out infinite; }
    @keyframes pulse{ 0%{ transform:scale(.9); opacity:.8 } 100%{ transform:scale(1.15); opacity:0 } }
    .scanline{ position:absolute; left:16%; right:16%; height:2px; background:linear-gradient(90deg,transparent,var(--red),transparent); top:22%; animation:scan 2.6s ease-in-out infinite; border-radius:2px; box-shadow:0 0 12px var(--red); }
    .viewfinder.detect .scanline{ display:none; }
    @keyframes scan{ 0%,100%{ top:24% } 50%{ top:76% } }
    .prompt{ text-align:center; } .prompt h1{ font-size:26px; font-weight:700; } .prompt p{ color:#b9adac; margin-top:6px; font-size:15px; min-height:22px; }
    .btn{ border:none; cursor:pointer; font:inherit; font-weight:700; border-radius:12px; padding:12px 20px; font-size:14px; }
    .btn-ghost{ background:rgba(255,255,255,.08); color:#cfc7c6; }
    .link{ background:none; border:none; color:#8f8583; cursor:pointer; font:inherit; font-size:13px; text-decoration:underline; }
    .foot{ padding:14px; text-align:center; color:#6f6664; font-size:12px; } .foot b{ color:#a99f9d; }
    .banner{ background:rgba(245,158,11,.14); color:#fbbf24; border:1px solid rgba(245,158,11,.3); padding:10px 16px; border-radius:10px; font-size:13px; max-width:520px; text-align:center; }
    /* Picker (respaldo manual) */
    .picker{ position:fixed; inset:0; background:rgba(18,15,15,.92); backdrop-filter:blur(4px); display:none; flex-direction:column; z-index:20; }
    .picker.open{ display:flex; }
    .picker-head{ display:flex; align-items:center; justify-content:space-between; padding:22px 30px; }
    .picker-head h2{ font-size:20px; } .picker-head p{ color:#b9adac; font-size:13px; }
    .grid{ flex:1; overflow-y:auto; padding:10px 30px 30px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; align-content:start; }
    .emp{ background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:18px 12px; text-align:center; cursor:pointer; transition:.15s; }
    .emp:hover{ background:rgba(237,50,55,.14); border-color:var(--red); }
    .emp .av{ width:60px; height:60px; border-radius:50%; margin:0 auto 10px; display:grid; place-items:center; font-weight:800; font-size:20px; background:var(--red); color:#fff; }
    .emp .nm{ font-size:13.5px; font-weight:600; line-height:1.25; } .emp .dp{ font-size:11px; color:#b9adac; margin-top:3px; }
    /* Confirmación */
    .confirm{ position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:30; text-align:center; background:#141010; }
    .confirm.show{ display:flex; animation:fade .3s ease; }
    @keyframes fade{ from{ opacity:0; transform:scale(.96) } to{ opacity:1; transform:none } }
    .confirm.ok{ background:radial-gradient(900px 620px at 50% 32%, rgba(34,197,94,.28), rgba(20,16,16,0) 68%), #141010; }
    .confirm.warn{ background:radial-gradient(900px 620px at 50% 32%, rgba(245,158,11,.26), rgba(20,16,16,0) 68%), #141010; }
    .confirm.info{ background:radial-gradient(900px 620px at 50% 32%, rgba(56,189,248,.24), rgba(20,16,16,0) 68%), #141010; }
    .c-av{ width:130px; height:130px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:46px; color:#fff; position:relative; background:var(--red); overflow:visible; }
    .c-av img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }
    .c-badge{ position:absolute; right:-4px; bottom:-4px; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:22px; border:4px solid #141010; }
    .c-headline{ font-size:38px; font-weight:800; }
    .c-detail{ font-size:19px; color:#d8cfce; }
    .c-time{ font-size:64px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:1px; line-height:1; }
    .c-chip{ font-size:18px; font-weight:700; padding:8px 20px; border-radius:999px; }
    .chip-ok{ background:rgba(34,197,94,.18); color:#4ade80; } .chip-warn{ background:rgba(245,158,11,.18); color:#fbbf24; } .chip-info{ background:rgba(56,189,248,.16); color:#7dd3fc; }
    .c-type{ font-size:14px; letter-spacing:3px; text-transform:uppercase; color:#b9adac; }
    .cbar{ position:absolute; bottom:0; left:0; height:5px; background:var(--red); }
  </style>
</head>
<body>
  <div class="kiosk">
    <div class="top">
      <div class="brand"><img src="assets/logo.png" alt="Mallatex" /><div><b>Mallatex</b><span>Control de acceso</span></div></div>
      <div class="clock"><div class="t" id="clock">--:--</div><div class="d" id="date">—</div></div>
    </div>
    <div class="stage">
      <div class="viewfinder" id="vf">
        <div class="ring"></div><div class="pulse"></div>
        <video id="video" autoplay muted playsinline></video>
        <div class="scanline"></div>
      </div>
      <div class="prompt">
        <h1 id="promptTitle">Coloca tu rostro frente a la cámara</h1>
        <p id="promptSub">Reconocimiento facial · Registro de entrada y salida</p>
      </div>
      <div id="banner"></div>
      <button class="link" id="manualLink">¿Problemas con la cámara? Registro manual</button>
    </div>
    <div class="foot">Checador principal · Recepción &nbsp;·&nbsp; powered by <b>Evorgyn</b></div>
  </div>

  <!-- Respaldo manual -->
  <div class="picker" id="picker">
    <div class="picker-head">
      <div><h2>Registro manual</h2><p>Selecciona tu nombre para registrar el acceso</p></div>
      <button class="btn btn-ghost" id="closePicker">Cerrar</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- Confirmación -->
  <div class="confirm" id="confirm">
    <div class="c-type" id="cType">ENTRADA</div>
    <div class="c-av" id="cAv"></div>
    <div class="c-headline" id="cHead">—</div>
    <div class="c-time" id="cTime">--:--</div>
    <div class="c-detail" id="cDetail">—</div>
    <div class="c-chip" id="cChip">—</div>
    <div class="cbar" id="cBar"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    function tick(){ const d=new Date(); $('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); $('date').textContent=`${DAYS[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
    tick(); setInterval(tick,1000);

    let cooldownUntil = 0, processing = false, stream = null, modelsReady = false;

    async function initCamera(){
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        $('banner').innerHTML = '<div class="banner">La cámara requiere HTTPS o localhost. Usa el registro manual mientras tanto.</div>';
        $('promptSub').textContent = 'Cámara no disponible en este contexto';
        return false;
      }
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:640}, height:{ideal:480} }, audio:false });
        $('video').srcObject = stream; await $('video').play().catch(()=>{});
        return true;
      }catch(e){
        $('banner').innerHTML = `<div class="banner">No se pudo acceder a la cámara (${e.name||e.message}). Usa el registro manual.</div>`;
        return false;
      }
    }

    async function loadModels(){
      $('promptSub').textContent = 'Cargando reconocimiento facial…';
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri('/models'),
        faceapi.nets.faceLandmark68Net.loadFromUri('/models'),
        faceapi.nets.faceRecognitionNet.loadFromUri('/models'),
      ]);
      modelsReady = true;
      $('promptSub').textContent = 'Reconocimiento facial · Registro de entrada y salida';
    }

    let noMatchShownAt = 0;
    async function loop(){
      const video = $('video');
      if(modelsReady && stream && !processing && Date.now() > cooldownUntil && video.readyState >= 2){
        try{
          const opts = new faceapi.TinyFaceDetectorOptions({ inputSize:320, scoreThreshold:0.5 });
          const det = await faceapi.detectSingleFace(video, opts).withFaceLandmarks().withFaceDescriptor();
          if(det){
            $('vf').classList.add('detect');
            processing = true;
            $('promptSub').textContent = 'Reconociendo…';
            const res = await fetch('/api/kiosk/checkin', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ descriptor: Array.from(det.descriptor) }) });
            if(res.ok){ showConfirm(await res.json()); cooldownUntil = Date.now() + 8000; }
            else {
              if(Date.now() - noMatchShownAt > 2500){ $('promptSub').innerHTML = '<span style="color:#fbbf24">Rostro no reconocido · acude a RH para tu registro</span>'; noMatchShownAt = Date.now(); }
              cooldownUntil = Date.now() + 1500;
            }
            processing = false;
          } else {
            $('vf').classList.remove('detect');
            if(Date.now() - noMatchShownAt > 2500) $('promptSub').textContent = 'Reconocimiento facial · Registro de entrada y salida';
          }
        }catch(e){ processing = false; }
      }
      requestAnimationFrame(()=> setTimeout(loop, 350));
    }

    let confirmTimer = null;
    function showConfirm(d){
      const c = $('confirm'); c.className = 'confirm show ' + d.tone;
      const toneColor = d.tone==='ok'?'#22c55e':d.tone==='warn'?'#f59e0b':'#38bdf8';
      $('cType').textContent = d.type==='entrada'?'ENTRADA':'SALIDA';
      $('cAv').innerHTML = (d.employee.photo ? `<img src="${d.employee.photo}"/>` : d.employee.initials) + `<span class="c-badge" style="background:${toneColor}">${d.type==='entrada'?'↳':'↰'}</span>`;
      $('cHead').textContent = d.headline; $('cTime').textContent = d.time;
      $('cDetail').textContent = `${d.detail} · ${d.employee.name}`;
      const chip = $('cChip'); chip.textContent = d.statusLabel; chip.className = 'c-chip ' + (d.tone==='ok'?'chip-ok':d.tone==='warn'?'chip-warn':'chip-info');
      const total = 6000, bar = $('cBar'); bar.style.background = toneColor; bar.style.transition='none'; bar.style.width='100%';
      requestAnimationFrame(()=>{ bar.style.transition=`width ${total}ms linear`; bar.style.width='0%'; });
      clearTimeout(confirmTimer); confirmTimer = setTimeout(()=>{ c.classList.remove('show'); $('vf').classList.remove('detect'); }, total);
      c.onclick = ()=>{ clearTimeout(confirmTimer); c.classList.remove('show'); };
    }

    // Respaldo manual
    async function loadPicker(){
      const emps = await (await fetch('/api/kiosk/employees')).json();
      const grid = $('grid'); grid.innerHTML='';
      for(const e of emps){ const el=document.createElement('div'); el.className='emp'; el.innerHTML=`<div class="av">${e.initials}</div><div class="nm">${e.name}</div><div class="dp">${e.department||''}</div>`; el.onclick=()=>manualCheckin(e.id); grid.appendChild(el); }
    }
    async function manualCheckin(employeeId){
      $('picker').classList.remove('open');
      const res = await fetch('/api/kiosk/checkin', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ employeeId }) });
      const d = await res.json(); if(res.ok){ showConfirm(d); cooldownUntil = Date.now()+8000; }
    }
    $('manualLink').onclick = ()=>{ loadPicker(); $('picker').classList.add('open'); };
    $('closePicker').onclick = ()=> $('picker').classList.remove('open');

    (async function main(){
      // face-api se carga con defer; esperar a que exista
      let tries=0; while(!window.faceapi && tries<50){ await new Promise(r=>setTimeout(r,100)); tries++; }
      const cam = await initCamera();
      if(cam && window.faceapi){ try{ await loadModels(); }catch(e){ $('banner').innerHTML='<div class="banner">No se pudieron cargar los modelos de reconocimiento.</div>'; } }
      loop();
    })();
  </script>
</body>
</html>
