<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plataforma de Asistencia · Mallatex</title>
  <meta name="description" content="Control de asistencia e integración con NOI — Digital Enigma" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Pantalla de acceso -->
  <div id="login" class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <img src="assets/logo.svg" alt="Digital Enigma" width="52" height="52" />
        <div>
          <strong>Digital&nbsp;Enigma</strong>
          <span>Plataforma de Asistencia · NOI</span>
        </div>
      </div>
      <h1>Iniciar sesión</h1>
      <p class="login-sub">Control de asistencia e integración con Aspel NOI para <b>Mallatex</b>.</p>
      <form id="login-form">
        <label>Correo
          <input type="email" name="email" value="nomina@mallatex.mx" autocomplete="username" required />
        </label>
        <label>Contraseña
          <input type="password" name="password" value="mallatex2026" autocomplete="current-password" required />
        </label>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        <p class="login-error" id="login-error"></p>
      </form>
      <div class="login-hint">
        <span>Cuentas demo:</span>
        <button type="button" data-demo="admin@mallatex.mx">Administrador</button>
        <button type="button" data-demo="contabilidad@mallatex.mx">Contador general</button>
        <button type="button" data-demo="nomina@mallatex.mx">Nómina</button>
      </div>
    </div>
    <footer class="login-foot">Implementación progresiva sobre plataforma Digital Enigma · Julio 2026</footer>
  </div>

  <!-- Aplicación -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.svg" alt="" width="34" height="34" />
        <div>
          <strong>Mallatex</strong>
          <span>Asistencia · NOI</span>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="powered">Powered by<br /><b>Digital Enigma</b></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="menu-toggle" aria-label="Menú">☰</button>
          <div>
            <div class="topbar-title" id="view-title">Tablero</div>
            <div class="topbar-sub" id="view-sub"></div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="period-picker">
            <label>Periodo</label>
            <select id="period-select"></select>
          </div>
          <div class="user-chip" id="user-chip">
            <div class="avatar" id="user-avatar">·</div>
            <div class="user-meta">
              <span id="user-name">—</span>
              <small id="user-role">—</small>
            </div>
            <button class="icon-btn" id="logout-btn" title="Cerrar sesión">⏻</button>
          </div>
        </div>
      </header>

      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
