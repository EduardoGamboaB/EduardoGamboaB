<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mallatex · Plataforma de Asistencia</title>
  <meta name="description" content="Mallatex — Control de asistencia e integración con Aspel NOI" />
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Pantalla de acceso -->
  <div id="login" class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <img class="login-logo" src="assets/mallatex-logo.png" alt="Mallatex — Protegemos lo que siembras" />
      </div>
      <div class="login-tag">Plataforma de Asistencia · NOI</div>
      <h1>Iniciar sesión</h1>
      <p class="login-sub">Control de asistencia e integración con <b>Aspel NOI</b> (módulo de nómina).</p>
      <div class="seg login-seg" id="persona-seg">
        <button type="button" data-persona="admin" class="active">Administrativo</button>
        <button type="button" data-persona="empleado">Empleado</button>
      </div>
      <form id="login-form">
        <div id="admin-fields">
          <label>Correo
            <input type="email" name="email" value="nomina@mallatex.mx" autocomplete="username" />
          </label>
          <label>Contraseña
            <input type="password" name="password" value="mallatex2026" autocomplete="current-password" />
          </label>
        </div>
        <div id="emp-fields" class="hidden">
          <label>Código de empleado
            <input type="text" name="code" placeholder="MTX001" autocomplete="username" />
          </label>
          <label>PIN
            <input type="password" name="pin" placeholder="••••" autocomplete="current-password" />
          </label>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        <p class="login-error" id="login-error"></p>
      </form>
      <div class="login-hint" id="hint-admin">
        <span>Cuentas demo:</span>
        <button type="button" data-demo="admin@mallatex.mx">Administrador</button>
        <button type="button" data-demo="contabilidad@mallatex.mx">Contador general</button>
        <button type="button" data-demo="nomina@mallatex.mx">Nómina</button>
        <button type="button" data-demo="comercial@mallatex.mx">Gerente comercial</button>
      </div>
      <div class="login-hint hidden" id="hint-emp">
        <span>Demo empleado:</span> Código <b>MTX001</b> &nbsp;·&nbsp; PIN <b>1234</b>
      </div>
    </div>
    <footer class="login-foot">powered by <b>Evorgyn</b></footer>
  </div>

  <!-- Aplicación -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.png" alt="" width="34" height="34" />
        <div>
          <strong>Mallatex</strong>
          <span>Asistencia · NOI</span>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="powered">powered by <b>Evorgyn</b></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="menu-toggle" aria-label="Menú">☰</button>
          <div>
            <div class="topbar-title" id="view-title">Tablero</div>
            <div class="topbar-sub" id="view-sub"></div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="period-picker">
            <label>Periodo</label>
            <select id="period-select"></select>
          </div>
          <div class="user-chip" id="user-chip">
            <div class="avatar" id="user-avatar">·</div>
            <div class="user-meta">
              <span id="user-name">—</span>
              <small id="user-role">—</small>
            </div>
            <button class="icon-btn" id="logout-btn" title="Cerrar sesión">⏻</button>
          </div>
        </div>
      </header>

      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
