# Despliegue de referencia: app + PostgreSQL + reverse-proxy TLS.
# La cámara del kiosco (getUserMedia) exige contexto seguro (HTTPS), por eso se termina
# TLS en el proxy. Ajusta dominios, certificados y contraseñas antes de usar en producción.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mallatex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia-esta-contrasena}
      POSTGRES_DB: mallatex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mallatex"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: mallatex-asistencia:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      STORAGE: postgres
      DATABASE_URL: postgres://mallatex:${POSTGRES_PASSWORD:-cambia-esta-contrasena}@db:5432/mallatex
      TRUST_PROXY: "1"
    expose:
      - "3000"
    # No se publica el puerto directamente: el acceso es a través del proxy TLS.

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
